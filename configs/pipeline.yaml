aoi:
  # National for both: labels are chipped across every province and the delivered
  # map covers the same extent. Build once with `cmrv aoi-sa`.
  train_path: data/aoi/processed/south_africa.parquet
  infer_path: data/aoi/processed/south_africa.parquet
  tile_km: 10
  # tile/block grids build in SA Albers equal-area (see cmrv.aoi.SA_ALBERS) — national,
  # true-square tiles country-wide.

# Three phenology-tuned months per rainfall-seasonality zone. There is no default
# calendar: a zone is resolved from the province, and an unresolved one raises.
#
# **The YYYY below is a placeholder — only the month and day are ever read.**
#   • `cmrv ingest-chips` prepends each label's own event_date year, so the 3 windows
#     come from the SAME year as the label (single-year phenology).
#   • `cmrv infer` prepends its --year argument.
# Red-edge bands (B05–B07, B8A) carry most of the discriminatory signal in both sets.
# The temporal head masks any month with no cloud-free composite.
months_by_zone:
  # Western Cape / Northern Cape — Mediterranean winter rainfall
  #   feb — peak dry-summer trough: evergreen Pinus/Eucalyptus/Hakea stand out
  #         against the senesced fynbos/herbaceous matrix.
  #   may — autumn transition (non-flowering baseline; green-down).
  #   sep — spring green-up + Acacia flowering (yellow bloom = wattle-specific).
  winter_rainfall:
    - {start: "0000-02-01", end: "0000-02-28", label: feb}
    - {start: "0000-05-01", end: "0000-05-31", label: may}
    - {start: "0000-09-01", end: "0000-09-30", label: sep}
  # KZN / EC / Limpopo / Mpumalanga / NW / FS / Gauteng — from Masemola et al. 2020,
  # "Sentinel-2 time series … optimal features and time window for mapping invasive
  # Acacia … KwaZulu-Natal" (Int. J. Appl. Earth Obs. Geoinf. 93, 102207). Best Acacia
  # accuracy came from dry + flowering + growing-season imagery; jul/sep/dec each >80%:
  #   jul — dry-winter senescence: native grassland/savanna dormant & brown, evergreen
  #         Pine/Wattle/Gum (and structural canopy) stand out most.
  #   sep — Acacia (mearnsii/dealbata) flowering + early green-up — wattle-specific.
  #   dec — early-to-peak summer growth (Nov–mid-Mar): full-canopy red-edge separability.
  summer_rainfall:
    - {start: "0000-07-01", end: "0000-07-31", label: jul}
    - {start: "0000-09-01", end: "0000-09-30", label: sep}
    - {start: "0000-12-01", end: "0000-12-31", label: dec}

# Province (aoi_admin1) → rainfall-seasonality zone. An unlisted province RAISES at
# ingest-chips — it does not default. Guessing winter_rainfall for a summer-rainfall
# label chips the wrong calendar and nothing downstream can detect it.
admin1_zone:
  western_cape: winter_rainfall
  kwazulu_natal: summer_rainfall
  eastern_cape: summer_rainfall
  limpopo: summer_rainfall
  mpumalanga: summer_rainfall
  north_west: summer_rainfall
  free_state: summer_rainfall
  gauteng: summer_rainfall
  northern_cape: winter_rainfall

s2_bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
# Scene-level cloud cover cap. SCL masking handles per-pixel cloud removal,
# so this is set permissively (95) — letting more candidate scenes into the
# monthly median, after which SCL strips the bad pixels per-scene.
cloud_cover_max: 95
# Keep only the N least-cloudy scenes per month window. The permissive cap above
# plus ±15d window padding can pull 60+ scenes into a single median; the time axis
# multiplies compute memory directly, and beyond ~20 scenes the median stops
# improving while the RAM bill keeps climbing.
max_scenes_per_composite: 20
