aoi:
  # National for both: labels are chipped across every province and the delivered
  # map covers the same extent. Build once with `cmrv aoi-sa`.
  train_path: data/aoi/processed/south_africa.parquet
  infer_path: data/aoi/processed/south_africa.parquet
  tile_km: 10
  # tile/block grids build in SA Albers equal-area (see cmrv.aoi.SA_ALBERS) — national,
  # true-square tiles country-wide.

# Three phenology-tuned months per rainfall-seasonality zone. There is no default
# calendar: a zone is resolved from the province, and an unresolved one raises.
#
# **The YYYY below is a placeholder — only the month and day are ever read.**
#   • `cmrv ingest-chips` prepends each label's own event_date year, so the 3 windows
#     come from the SAME year as the label (single-year phenology).
#   • `cmrv infer` prepends its --year argument.
# Red-edge bands (B05–B07, B8A) carry most of the discriminatory signal in both sets.
# The temporal head masks any month with no cloud-free composite.
months_by_zone:
  # Western Cape / Northern Cape — Mediterranean winter rainfall
  #   feb — peak dry-summer trough: evergreen Pinus/Eucalyptus/Hakea stand out
  #         against the senesced fynbos/herbaceous matrix.
  #   may — autumn transition (non-flowering baseline; green-down).
  #   sep — spring green-up + Acacia flowering (yellow bloom = wattle-specific).
  winter_rainfall:
    - {start: "0000-02-01", end: "0000-02-28", label: feb}
    - {start: "0000-05-01", end: "0000-05-31", label: may}
    - {start: "0000-09-01", end: "0000-09-30", label: sep}
  # KZN / EC / Limpopo / Mpumalanga / NW / FS / Gauteng — from Masemola et al. 2020,
  # "Sentinel-2 time series … optimal features and time window for mapping invasive
  # Acacia … KwaZulu-Natal" (Int. J. Appl. Earth Obs. Geoinf. 93, 102207). Best Acacia
  # accuracy came from dry + flowering + growing-season imagery; jul/sep/dec each >80%:
  #   jul — dry-winter senescence: native grassland/savanna dormant & brown, evergreen
  #         Pine/Wattle/Gum (and structural canopy) stand out most.
  #   sep — Acacia (mearnsii/dealbata) flowering + early green-up — wattle-specific.
  #   dec — early-to-peak summer growth (Nov–mid-Mar): full-canopy red-edge separability.
  summer_rainfall:
    - {start: "0000-07-01", end: "0000-07-31", label: jul}
    - {start: "0000-09-01", end: "0000-09-30", label: sep}
    - {start: "0000-12-01", end: "0000-12-31", label: dec}

# Province (aoi_admin1) → rainfall-seasonality zone. An unlisted province RAISES at
# ingest-chips — it does not default. Guessing winter_rainfall for a summer-rainfall
# label chips the wrong calendar and nothing downstream can detect it.
admin1_zone:
  western_cape: winter_rainfall
  kwazulu_natal: summer_rainfall
  eastern_cape: summer_rainfall
  limpopo: summer_rainfall
  mpumalanga: summer_rainfall
  north_west: summer_rainfall
  free_state: summer_rainfall
  gauteng: summer_rainfall
  northern_cape: winter_rainfall

s2_bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]

# --- chip geometry -----------------------------------------------------------
# ONE source of truth for the chip/window size. `ingest-chips` cuts chips this
# wide, `embed --output-grid` defaults to it, and `cmrv infer` tiles dense windows
# of exactly this size. They must agree: the head learns the CENTRE token of a
# chip_px chip embedded at output_grid = chip_px, which is one token per 10 m
# pixel. Changing one alone would silently change what a token covers, and with
# it the resolution of the delivered map.
#
# 128 px = 1.28 km of context around the labelled pixel (64 px gave 640 m). Only
# the centre token is trained on, but UniverSat's attention is global over the
# token grid, so the extra context reaches it. The cost is the ViT's O(L^2)
# attention: L goes 4096 -> 16384, so embedding is ~16x the work of 64 px.
chip_px: 128

# --- scene selection ---------------------------------------------------------
# There is no scene-level cloud filter any more. `eo:cloud_cover` describes a
# 110 km MGRS tile and says almost nothing about a 1.3 km chip, so it was both
# choosing the wrong scenes and hiding good ones. Selection is now per chip: read
# SCL (one uint8 asset) for every candidate date and keep the clearest.
#
# Acquisition dates kept per month window, per chip. 1 = take the single clearest
# date over that chip. There is no median to repair cloud holes at 1, which is
# why min_valid_frac is high and why the centre pixel is checked explicitly.
# Raise to 2-3 if the drop rate is too high; then re-chip everything, and do not
# mix the two in one training set.
max_dates_per_month: 1
# Fraction of the chip a date's real footprints must cover before any pixel is
# read. Free to evaluate — it uses the STAC item geometry, not its bbox.
min_coverage: 0.98
# Fraction of the finished chip that must be finite in every band.
min_valid_frac: 0.85
# Ceiling on candidate dates put through the SCL screen. A +/-15 d window over SA
# yields ~10-25 dates; this only bounds a pathological one.
screen_max_dates: 24
# Concurrent asset reads inside one chip (odc-stac's own pool). Total in-flight
# sockets is `ingest-chips --max-workers` x this. 20 x 8 = 160 streams on a
# 39 Mbit/s link gives each ~30 KB/s — slow enough that GDAL's stall watchdog
# killed healthy reads, and each kill throws away a month's download. With
# ~270 ms latency and a 4.9 MB/s ceiling, a few dozen streams already saturate
# the link; past that, concurrency buys only contention.
read_pool: 4

# Side of the square within which chips share a "clearest date" answer, so a
# neighbour skips the cloud-check reads entirely. Screening is roughly half of
# what a chip costs to download. Measured on the real 93,348 thinned labels:
# at 2 km, 69% of labels have a neighbour that already answered (47% at 1 km,
# 87% at 5 km). 2 km is the conservative pick — the wider the square, the more
# often a cloud edge inside it makes the remembered date wrong. A wrong answer
# is cheap: the finished chip is still checked, and a failure falls back to a
# full screen. Set to 0 to switch the sharing off.
date_cell_m: 2000

# Acquisition dates medianed per month for `cmrv infer`. A chip takes 1, because
# a single date can be clear over 1.3 km. No single date is clear over a whole
# inference box, so there the median does real work.
infer_max_dates: 6
