# Label schema for Invasive Alien Tree mapping
#
# Class IDs are stable integers. ``class_id`` is NEVER assigned at ingest —
# training subsets crosswalk (species_normalized → class_id) via
# class_maps.<name>.<id>.members[] below, applied at `cmrv make-split` time.
#
# One national map: sa_landcover. Native biomes (VegMap T_BIOME) + transformed
# classes (SANLC accuracy points) are explicit alongside the alien genera.
#
# Single source of truth: each class lists its ``members`` — the strings an adapter
# actually emits as ``species_normalized``.
# ----------------------------------------------------------------------------

nodata: 255

# The class map every verb uses when none is named on the command line.
default_class_map: sa_landcover

# ----------------------------------------------------------------------------
# class_maps — one entry per training config; keyed by config name.
# ----------------------------------------------------------------------------
class_maps:

  # --------------------------------------------------------------------------
  # Unified land-cover map: IAP genera (field) + native biomes (VegMap T_BIOME)
  # + transformed/other (collapsed SANLC accuracy-point classes). Every pixel
  # classified → seamless map.
  sa_landcover:
    # --- alien invasive genera (MapWAPS Alien_* classes) ---
    # ``members`` is the exact string the adapter emits; ``genus_fallback`` also
    # catches any binomial in that genus, so a species-level source needs no edit
    # here. Class 5 (iap_riparian: Leptospermum + Sesbania) was removed on
    # 2026-08-12 — no adapter surveys either genus.
    0: {name: acacia_spp,     members: ["Acacia"],     genus_fallback: true, genus: acacia}
    1: {name: pinus_spp,      members: ["Pinus"],      genus_fallback: true, genus: pinus}
    2: {name: eucalyptus_spp, members: ["Eucalyptus"], genus_fallback: true, genus: eucalyptus}
    3: {name: hakea_spp,      members: ["Hakea"],      genus_fallback: true, genus: hakea}
    4: {name: prosopis_spp,   members: ["Prosopis"],   genus_fallback: true, genus: prosopis}
    # --- native biomes (VegMap T_BIOME) ---
    6:  {name: fynbos,          members: ["fynbos"]}
    7:  {name: succulent_karoo, members: ["succulent_karoo"]}
    8:  {name: nama_karoo,      members: ["nama_karoo"]}
    9:  {name: albany_thicket,  members: ["albany_thicket"]}
    10: {name: forest,          members: ["forest"]}
    11: {name: azonal,          members: ["azonal"]}
    12: {name: grassland,       members: ["grassland"]}
    # --- transformed / other (collapsed SANLC accuracy-point classes) ---
    13: {name: built_up,        members: ["built_up"]}
    14: {name: cultivated,      members: ["cultivated"]}
    15: {name: planted_forest,  members: ["planted_forest"]}
    16: {name: bare,            members: ["bare"]}
    17: {name: water,           members: ["water"]}
    18: {name: wetland,         members: ["wetland"]}
    # --- added for multi-catchment SA coverage (WC Renosterveld; KZN/EC summer-rainfall) ---
    19: {name: renosterveld,    members: ["renosterveld"]}   # own class (was folded into fynbos)
    20: {name: savanna,         members: ["savanna"]}        # native woody: MapWAPS Indigenous Bush_*
    21: {name: populus_spp,   members: ["Populus"],    genus_fallback: true, genus: populus}
    22: {name: burnt,           members: ["burnt"]}
    23: {name: bracken,         members: ["bracken"]}   # Pteridium aquilinum — native
